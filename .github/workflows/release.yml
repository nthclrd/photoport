name: Release

# Push a tag like v0.2.0 to build installers for the 3 OS and publish a
# draft GitHub Release. Review the draft, then click "Publish".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal (.dmg)
            os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux (.deb, .AppImage)
            os: ubuntu-22.04
            args: ""
            rust_targets: ""
          - name: Windows (.exe NSIS, .msi)
            os: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Front-end dependencies
        working-directory: app
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # --- macOS signing + notarization (docs/RELEASE.md). Leave unset = unsigned build.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          # --- Auto-update signature (docs/RELEASE.md). Needed once the updater is enabled.
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: PhotoPort ${{ github.ref_name }}
          releaseBody: |
            Télécharge l'installeur de ton système ci-dessous.
            - Windows : `PhotoPort_*_x64-setup.exe` (nécessite l'app gratuite « Apple Devices » du Microsoft Store)
            - macOS : `PhotoPort_*_universal.dmg`
            - Linux : `.deb` (Debian/Ubuntu) ou `.AppImage` (toutes distributions, nécessite `usbmuxd`)
          releaseDraft: true
          prerelease: false
          # To enable auto-update, add: --features updater --config src-tauri/tauri.updater.conf.json
          args: ${{ matrix.args }}

  cli:
    name: CLI ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p photoport-cli
      - name: Attach CLI to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bin=target/release/photoport
          [ "$RUNNER_OS" = "Windows" ] && bin="$bin.exe"
          name="photoport-cli-${RUNNER_OS,,}-$(uname -m)"
          [ "$RUNNER_OS" = "Windows" ] && name="$name.exe"
          cp "$bin" "$name"
          gh release upload "${GITHUB_REF_NAME}" "$name" --clobber
